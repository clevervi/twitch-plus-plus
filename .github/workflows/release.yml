name: Release

# Prepara el release en una rama y abre un pull request. `main` exige que
# todos los cambios entren por PR, y ademas necesita la comprobacion `verify`,
# que el propio workflow no puede ejecutar sobre el commit que crea.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "major | minor | patch"
        required: true
        default: patch
      notes:
        description: "Notas del release (una linea por punto, separadas por ;)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump + build
        run: |
          node scripts/bump.mjs "${{ inputs.level }}" "${{ inputs.notes }}"
          node scripts/lint.mjs
          node tools/check-language.mjs
          node scripts/build.mjs
          node --test

      - name: Publicar la rama y abrir el pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIVEL: ${{ inputs.level }}
        run: |
          version="$(node -p "require('./package.json').version")"
          branch="release/v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json CHANGELOG.md dist/
          git commit -m "chore(release): v${version}"
          git push -u origin "$branch"
          {
            echo "Bump a **v${version}** generado por el workflow \`Release\` con nivel \`${NIVEL}\`."
            echo
            echo "Hecho automáticamente. Revisa el CHANGELOG y \`dist/\` antes de mezclar."
          } > nota.md
          gh pr create --base main --head "$branch" \
            --title "chore(release): v${version}" \
            --body-file nota.md \
            --label "tipo:chore" --label "area:infra"
