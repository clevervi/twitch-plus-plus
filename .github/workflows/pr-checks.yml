name: PR Checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validar convenciones del PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar rama, título, cuerpo y etiquetas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Las etiquetas se leen de la API y no del payload del evento:
          # `gh pr create --label` crea el PR y lo etiqueta después, así que
          # el payload de `opened` llega vacío y el check falla siempre.
          # Asignar en la línea de comando, no con export: solo así la
          # variable llega al entorno del proceso node.
          PR_LABELS="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | @json')" \
            node scripts/validate-pr.mjs
