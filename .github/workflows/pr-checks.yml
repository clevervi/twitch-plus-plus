name: PR Checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
    # El workflow Release abre sus propios PRs: no llevan issue porque el
    # propio trabajo ya estaba revisado cuando se pidió el release.
    branches-ignore:
      - "release/**"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validar convenciones del PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar rama, título, cuerpo y etiquetas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/validate-pr.mjs
