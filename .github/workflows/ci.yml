name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm run verify` es la única definición de qué hay que comprobar:
      # lint + detector de idioma + build + tests. Reimplementar los pasos aquí
      # a mano ya ha causado que un paso se quedara fuera sin que nadie lo notase.
      - name: Verificar (lint, idioma, build y tests)
        run: npm run verify

      - name: El bundle no debe haber derivado
        run: git diff --exit-code dist/

      - name: El YAML de .github debe ser válido
        run: |
          for f in $(find .github -name '*.yml'); do
            ruby -ryaml -e "YAML.load_file(ARGV[0])" "$f" || { echo "YAML inválido: $f"; exit 1; }
          done
