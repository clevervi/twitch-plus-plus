name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: node scripts/lint.mjs

      - name: Build
        run: node scripts/build.mjs

      - name: El bundle no debe tener drifted
        run: git diff --exit-code dist/

      - name: El YAML de .github debe ser válido
        run: |
          for f in $(find .github -name '*.yml'); do
            ruby -ryaml -e "YAML.load_file(ARGV[0])" "$f" || { echo "YAML invalido: $f"; exit 1; }
          done

      - name: Tests
        run: node --test
