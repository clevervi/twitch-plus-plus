<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fixture de Twitch</title>
  <!--
    El bundle inyecta su CSS en document-start, antes de que exista <body>, y
    el <style> que crea lleva los estilos de las features. Si este fixture no
    tuviera <head>, el style acabaría colgado del propio Document, que es
    válido pero frágil. La página real de Twitch siempre trae <head>, así que
    la fixture también.
  -->
  <style>
    /* Imita lo mínimo de la maquetación de Twitch para que los selectores
       del script enganchen algo. Los valores concretos no importan: lo que se
       comprueba es que el script encuentre cada cosa donde espera. */    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #0e0e10; color: #efeff1; }
    .layout { display: flex; min-height: 100vh; }
    .sidenav { width: 240px; flex: 0 0 240px; background: #18181b; padding: 10px; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .player { position: relative; aspect-ratio: 16/9; background: #000; }
    .chat { width: 340px; flex: 0 0 340px; background: #18181b; display: flex; flex-direction: column; }
    .chat-scrollable-area__message-container { flex: 0 0 200px; overflow-y: auto; padding: 8px; }
    .chat-line__message { margin: 4px 0; }
    .chat-line__username { font-weight: 700; color: #bfbfbf; margin-right: 6px; }
    .chat-input { display: flex; gap: 6px; padding: 8px; }
    .chat-input textarea { flex: 1; min-height: 40px; background: #0e0e10; color: #efeff1; border: 1px solid #3a3a3d; border-radius: 4px; }
    .side-nav-card { display: block; padding: 6px; border-radius: 4px; }
    .tw-transition-group { margin-bottom: 8px; }
    [data-a-target="top-nav-container"] { display: flex; justify-content: flex-end; gap: 8px; padding: 8px; }
    .channel-info-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #18181b; }
    .channel-info-bar__title { font-weight: 700; }
  </style>
  <!--
    El bundle se carga como un script normal, en el <head>, que es lo más
    cercano a `@run-at document-start` que se puede sin `addInitScript`.

    Probar con `addInitScript` parece más fiel pero no funciona: se ejecuta
    antes de que exista cualquier nodo del documento, y entonces
    `document.head` y `document.documentElement` son los dos null. El bundle
    aborta en `bootStyles()` y el script entero no arranca. Se comprobó que
    colgar el <style> del propio nodo Document tampoco vale: impide que el
    analizador construya la página.
  -->
  <script src="./bundle.js"></script>
</head>
<body>
  <!--
    El botón de perfil lleva la misma forma que en Twitch: una imagen dentro con
    el nombre en el alt. `currentUsername()` lee el alt primero, y si no lo
    encuentra parsea el aria-label buscando "X's user menu". Sin ninguna de las
    dos cosas devuelve null y las features que dependen de saber quién eres
    (menciones, chatters) no hacen nada: sus tests pasarían sin comprobar nada.
  -->
  <div data-a-target="top-nav-container">
    <button data-a-target="user-menu-button" aria-label="darkt's user menu">
      Perfil
      <img alt="darkt" width="24" height="24">
    </button>
  </div>

  <div class="layout">
    <nav data-a-target="side-nav-bar" aria-label="Primary navigation">
      <!--
        Botón de reclamo de Channel Points. `auto-claim` viene activada por
        defecto, así que sin este nodo la ruta que lo busca y decide si pulsa
        nunca se ejecuta en los tests. Con `Solo detectar` activo no pulsa, que
        es como lo usa el test.
      -->
      <button data-a-target="claim-bonus-button" class="claimable-bonus__icon" aria-label="Reclamar bonificación">
        Reclamar
      </button>
      <div class="tw-transition-group">
        <a class="side-nav-card" data-a-target="side-nav-card" href="/ibai">
          <span>ibai</span>
          <span data-a-target="side-nav-card__metadata">1,2 mil</span>
        </a>
        <a class="side-nav-card" data-a-target="side-nav-card" href="/auronplay">
          <span>auronplay</span>
        </a>
      </div>
      <a data-a-target="side-nav-more" href="/directory/category/99">Más</a>
      <!--
        Cards de la sidebar con las cuatro formas en las que Twitch marca una
        como desconectada. La feature `hideOfflineChannels` decide mirando
        esto, así que los tests necesitan las cuatro para poder comprobar que
        acierta y, sobre todo, que NO esconde una card que está en directo.
      -->
      <div class="tw-transition-group" data-test-selector="cards-prueba">
        <a class="side-nav-card" data-a-target="side-nav-card" href="/en-directo" data-estado="vivo-indicador">
          <span class="tw-channel-status-indicator"></span>
          <span>en_directo</span>
        </a>
        <a class="side-nav-card" data-a-target="side-nav-card" href="/con-contador" data-estado="vivo-contador">
          <span data-a-target="side-nav-card-viewer-count">1,2 mil</span>
          <span>con_contador</span>
        </a>
        <a class="side-nav-card" data-a-target="side-nav-card" href="/muerto-texto" data-estado="offline-texto">
          <span>muerto_texto</span>
          <span>Desconectado</span>
        </a>
        <a class="side-nav-card" data-a-target="side-nav-card" href="/muerto-clase" data-estado="offline-clase">
          <span class="side-nav-card--offline">muerto_clase</span>
        </a>
        <a class="side-nav-card" data-a-target="side-nav-card" href="/muerto-aria" data-estado="offline-aria"
           aria-label="muerto_aria, canal desconectado">
          <span>muerto_aria</span>
        </a>
        <a class="side-nav-card" data-a-target="side-nav-card" href="/offline_tv" data-estado="vivo-se-llama-offline">
          <span class="tw-channel-status-indicator"></span>
          <span>offline_tv</span>
        </a>
      </div>
    </nav>

    <main class="main">
      <div data-a-target="video-player" class="player">
        <video style="width:100%;height:100%"></video>
        <div class="player-controls"></div>
      </div>
      <!--
        Bloques que las features de "Modo limpio" esconden. Están aquí para que
        los tests puedan comprobar que display:none se aplica de verdad, con
        estilos calculados, y no solo que la feature "está activa".
      -->
      <div data-a-target="up-next-queue">A continuación</div>
      <div data-a-target="recommended-channels">Recomendados</div>
      <div data-a-target="stories-tray">Stories</div>
      <button data-a-target="stories-button">Stories</button>
      <div data-a-target="prime-offer">Prueba Prime</div>
      <div data-a-target="gift-sub-banner">Regala una subscripción</div>
      <!--
        Cabecera del canal con el contador de viewers. `viewer-analytics` busca
        aquí su ancla para insertar el badge; sin ella la feature se activa,
        recorre el chat y no inserta nada, que es indistinguible de que esté
        rota.
      -->
      <div class="channel-info-bar" data-a-target="channel-info-bar">
        <span class="channel-info-bar__title">darkt</span>
        <strong data-a-target="animated-channel-viewers-count">1.234</strong>
      </div>
    </main>

    <aside data-a-target="chat-room-component-layout" class="chat">
      <div class="chat-scrollable-area__message-container">
        <!--
          Relleno para que el contenedor tenga scroll de verdad. `chat-pause`
          busca un nodo con `overflow` y `scrollHeight > clientHeight`, y si no lo
          encuentra cae al padre, que no tiene scroll: entonces la pausa no se
          puede probar. Va DESPUÉS de las líneas reales para no mover los
          índices que usan los demás tests.
        -->
        <div style="height: 1200px"></div>
        <div class="chat-line__message" data-a-target="chat-line-message">
          <span class="chat-line__username">viewer1</span>Hola a todos
        </div>
        <div class="chat-line__message" data-a-target="chat-line-message">
          <span class="chat-line__username">viewer2</span>Buenas
        </div>
        <!--
          Una mención al usuario de la sesión. Las features de chat necesitan
          una línea que case con el patrón para poder demostrar que marcan, y
          dos que no, para demostrar que no marcan de más.
        -->
        <div class="chat-line__message" data-a-target="chat-line-message">
          <span class="chat-line__username">viewer3</span>oye @darkt 你看得见这条吗
        </div>
        <div class="chat-line__message" data-a-target="chat-line-message">
          <span class="chat-line__username">darkt</span>saludos a todos
        </div>
      </div>
      <div class="chat-input">
        <div class="chat-input__textarea-container">
          <textarea data-a-target="chat-input" placeholder="Enviar mensaje"></textarea>
        </div>
        <button data-a-target="chat-send-button">Enviar</button>
        <button data-a-target="chat-input-upsell">Suscríbete</button>
        <button data-a-target="bits-button">Bits</button>
        <button data-a-target="chat-rules-button">Normas</button>
        <button data-a-target="chat-commands-button">Comandos</button>
      </div>
    </aside>
  </div>
</body>
</html>
